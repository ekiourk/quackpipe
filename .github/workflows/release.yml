name: Lint, Test, and Publish

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project with lint dependencies
        run: uv sync --extra lint --frozen

      - name: Run ruff
        run: uv run ruff check .

  test:
    # quackpipe supports the DuckDB 1.4 LTS line and the current stable line.
    # The lock file pins one version; `uv run --with` overlays the matrix version
    # on top of it so the same lock is exercised against every supported DuckDB.
    name: Pytest (DuckDB ${{ matrix.duckdb }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        duckdb: ["1.4.5", "1.5.5"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project dependencies (all extras)
        run: uv sync --all-extras --frozen

      - name: Run tests with coverage
        run: uv run --with "duckdb==${{ matrix.duckdb }}" pytest --cov=quackpipe --cov-branch --cov-report=term --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: matrix.duckdb == '1.5.5'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-duckdb-next:
    # Early warning for the next DuckDB major. Informational only: a failure here
    # does not block merging or publishing.
    name: Pytest (DuckDB 2.0 pre-release, informational)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project dependencies (all extras)
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run --prerelease=allow --with "duckdb>=2.0.0.dev0" pytest

  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
